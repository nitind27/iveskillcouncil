      <stop offset="0%" stop-color="#FF9A3C"/>
      <stop offset="45%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#D45A00"/>
    </linearGradient>
    <linearGradient id="ribbonEdge" x1="0%" y1="0%" x2="0%" y2="100%">
