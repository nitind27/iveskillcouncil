    fill="none"
    stroke="#E6C96A"
    stroke-opacity="0.85"
    stroke-width="1.1"
    stroke-linejoin="round"
    d="M 48 11
       H 592
       C 604 11 614 18 618 26
       C 612 32 610 34 618 36
       C 610 38 612 40 618 46
       C 614 54 604 61 592 61
       H 48
       C 36 61 26 54 22 46
       C 30 40 32 38 22 36
       C 32 34 30 32 22 26
       C 26 18 36 11 48 11 Z"
  />

  <text
    x="320"
