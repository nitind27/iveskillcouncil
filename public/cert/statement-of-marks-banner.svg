<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 72" width="640" height="72" fill="none">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0A0"/>
      <stop offset="28%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#B8860B"/>
      <stop offset="78%" stop-color="#E8C86A"/>
      <stop offset="100%" stop-color="#C9A227"/>
